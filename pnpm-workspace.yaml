ignoredBuiltDependencies:
  - esbuild

# yaml <2.8.3 is vulnerable to a stack overflow on deeply nested collections
# (GHSA-48c2-rrv3-qjmp). It reaches us only as vite's optional config-loading
# peer, which still resolves 2.8.1. Drop this once vite ships a patched range.
overrides:
  yaml: '>=2.8.3'
